<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="public-read.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任沛新 · 知识库</title>
  <meta name="description" content="任沛新的知识库。一次阅读一条，可以按主题分组、筛选和搜索。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141210'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' fill='%23f0d2cb' font-family='serif'%3E任%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=term-back">
</head>
<body>
  <a class="skip" href="#note">进入当前笔记</a>
  <div class="shell blog-shell">
    <aside class="rail">
      <p class="seal" aria-hidden="true">任</p>

      <p class="who">格拉斯哥大学<br>MSc in Computing Science<br>Distinction</p>
      <div class="switch" role="navigation" aria-label="切换界面">

      </div>
      <div class="contact">
        <p><a href="mailto:renpeixin0924@icloud.com">renpeixin0924@icloud.com</a></p>
        <p><a href="tel:13180500889">13180500889</a></p>
        <p class="aim">求职 · 北京<br>人工智能、数据分析</p>
      </div>
    </aside>
    <main id="content" class="blog">
      <aside class="catalog">
        <p class="kicker">知识库</p>
        <p class="section-note">一次阅读一条。笔记在 <code>笔记/知识/</code>，新建一个 md 文件就是一个新主题。</p>
        <div class="chips" id="chips" role="toolbar" aria-label="按分组筛选"></div>
        <div class="toolbar">
          <label class="search">状态
            <select id="status">
              <option value="全部">全部状态</option>
              <option value="未掌握">未掌握</option>
              <option value="已能解释">已能解释</option>
            </select>
          </label>
          <label class="search">搜索
            <input id="q" type="search" placeholder="条目、要点或关键词" autocomplete="off">
          </label>
        </div>
        <p class="shown" aria-live="polite">显示 <span id="shown">0</span> / <span id="entry-total">0</span></p>
        <p id="group-note" class="section-note" hidden></p>
        <div id="catalog"></div>
        <p id="empty" hidden>没有匹配的条目。</p>
      </aside>
      <article class="reader" id="note" aria-live="polite">
        <button type="button" class="term-back" id="term-back" hidden>返回上一术语</button>
        <p class="kicker" id="note-group"></p>
        <h2 id="note-title">知识库</h2>
        <p class="badge" id="note-status" hidden></p>
        <div class="lead" id="note-summary"></div>
        <div class="article-body">
          <dl id="note-fields"></dl>
        </div>
        <div class="pager">
          <button type="button" class="clear" id="prev">上一条</button>
          <span id="pager-count"></span>
          <button type="button" class="clear" id="next">下一条</button>
        </div>
      </article>
    </main>
  </div>
  <script src="code-color.js"></script>
  <script>
    const input = document.querySelector("#q");
    const statusSelect = document.querySelector("#status");
    const chipBox = document.querySelector("#chips");
    const catalogBox = document.querySelector("#catalog");
    const groupNote = document.querySelector("#group-note");
    const shown = document.querySelector("#shown");
    const entryTotal = document.querySelector("#entry-total");
    const empty = document.querySelector("#empty");
    const noteGroup = document.querySelector("#note-group");
    const noteTitle = document.querySelector("#note-title");
    const noteStatus = document.querySelector("#note-status");
    const noteSummary = document.querySelector("#note-summary");
    const noteFields = document.querySelector("#note-fields");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const termBack = document.querySelector("#term-back");
    const pagerCount = document.querySelector("#pager-count");
    const articleBody = document.querySelector(".article-body");

    const fields = [
      ["要点", "points"],
      ["例子", "example"],
      ["常见误区", "pitfall"],
      ["来源", "sources"],
    ];

    let catalog = { topics: [] };
    let activeGroup = "全部";
    let currentKey = "";
    const trail = [];

    function appendLinked(parent, text) {
      const pattern = /https?:\/\/[^\s）)，。；、]+/g;
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        if (match.index > last) {
          parent.append(document.createTextNode(text.slice(last, match.index)));
        }
        const href = match[0];
        const link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = href;
        parent.append(link);
        last = match.index + href.length;
      }
      if (last < text.length) {
        parent.append(document.createTextNode(text.slice(last)));
      }
    }

    const linkedTopics = new Set(["操作系统", "计算机组成原理", "计算机网络"]);
    let termLinkTopic = "";
    let termLinkNames = [];

    function sortedNames(names) {
      return [...names].sort((left, right) => right.length - left.length || left.localeCompare(right, "zh"));
    }

    function namesForTopic(topic, exceptName) {
      if (!linkedTopics.has(topic)) return [];
      const seen = new Set();
      const names = [];
      for (const item of flatEntries()) {
        if (item.topic !== topic || item.name === exceptName || item.name.length < 2 || seen.has(item.name)) {
          continue;
        }
        seen.add(item.name);
        names.push(item.name);
      }
      return sortedNames(names);
    }

    function allTermNames() {
      const seen = new Set();
      const names = [];
      for (const item of flatEntries()) {
        if (item.name.length < 2 || seen.has(item.name)) continue;
        seen.add(item.name);
        names.push(item.name);
      }
      return sortedNames(names);
    }

    function entryByName(topic, name) {
      const rows = flatEntries();
      return rows.find((item) => item.topic === topic && item.name === name)
        || rows.find((item) => item.name === name);
    }

    function appendTermRun(parent, text) {
      let index = 0;
      while (index < text.length) {
        let matched = "";
        for (const name of termLinkNames) {
          if (text.startsWith(name, index)) {
            matched = name;
            break;
          }
        }
        if (matched) {
          const jump = document.createElement("button");
          jump.type = "button";
          jump.className = "term-link";
          jump.textContent = matched;
          const targetName = matched;
          jump.addEventListener("click", () => {
            followTerm(entryByName(termLinkTopic, targetName));
          });
          parent.append(jump);
          index += matched.length;
          continue;
        }
        let end = index + 1;
        while (end < text.length && !termLinkNames.some((name) => text.startsWith(name, end))) end += 1;
        parent.append(document.createTextNode(text.slice(index, end)));
        index = end;
      }
    }

    function appendTermText(parent, text) {
      const pattern = /https?:\/\/[^\s）)，。；、]+/g;
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        if (match.index > last) appendTermRun(parent, text.slice(last, match.index));
        const href = match[0];
        const link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = href;
        parent.append(link);
        last = match.index + href.length;
      }
      if (last < text.length) appendTermRun(parent, text.slice(last));
    }

    function appendInline(parent, text) {
      text.split("`").forEach((bit, index) => {
        if (index % 2 === 1) {
          const code = document.createElement("code");
          code.textContent = bit;
          parent.append(code);
        } else if (bit) {
          appendTermText(parent, bit);
        }
      });
    }

    function fillRich(node, text) {
      node.replaceChildren();
      String(text || "").split("```").forEach((piece, index) => {
        if (index % 2 === 1) {
          const newline = piece.indexOf("\n");
          const language = newline === -1 ? piece.trim() : piece.slice(0, newline).trim();
          const body = newline === -1 ? "" : piece.slice(newline + 1).replace(/\n$/, "");
          const pre = document.createElement("pre");
          pre.className = "code-block";
          pre.append(window.CodeColor.highlight(body, language));
          node.append(pre);
          return;
        }
        const paragraph = document.createElement("span");
        appendInline(paragraph, piece);
        node.append(paragraph);
      });
    }

    function flatEntries() {
      const rows = [];
      for (const topic of catalog.topics || []) {
        for (const group of topic.groups || []) {
          for (const entry of group.entries || []) {
            rows.push({
              ...entry,
              topic: topic.name,
              group: group.name,
              key: `${topic.name} · ${group.name} · ${entry.name}`,
              chip: `${topic.name} · ${group.name}`,
              topicNote: topic.note || "",
            });
          }
        }
      }
      return rows;
    }

    function filtered() {
      const query = input.value.trim().toLowerCase();
      const status = statusSelect.value;
      return flatEntries().filter((entry) => {
        if (activeGroup !== "全部" && entry.chip !== activeGroup) return false;
        if (status !== "全部" && (entry.status || "未掌握") !== status) return false;
        if (!query) return true;
        const blob = [
          entry.name, entry.summary, entry.points, entry.example,
          entry.pitfall, entry.related, entry.sources, entry.status,
          entry.group, entry.topic,
        ].join("\n").toLowerCase();
        return blob.includes(query);
      });
    }

    function hashKey() {
      const raw = location.hash.slice(1);
      if (!raw) return "";
      try {
        return decodeURIComponent(raw);
      } catch (_error) {
        return raw;
      }
    }

    function buildChips() {
      const topics = catalog.topics || [];
      const total = flatEntries().length;
      entryTotal.textContent = String(total);
      chipBox.replaceChildren();
      const names = ["全部"];
      const counts = { 全部: total };
      for (const topic of topics) {
        for (const group of topic.groups || []) {
          const name = `${topic.name} · ${group.name}`;
          names.push(name);
          counts[name] = (group.entries || []).length;
        }
      }
      for (const name of names) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.group = name;
        chip.textContent = `${name} ${counts[name] || 0}`;
        const on = name === activeGroup;
        chip.classList.toggle("is-active", on);
        chip.setAttribute("aria-pressed", on ? "true" : "false");
        chipBox.append(chip);
      }
    }

    function renderList(list) {
      catalogBox.replaceChildren();
      catalogBox.hidden = true;
      const note = list.length ? list[0].topicNote : "";
      groupNote.hidden = !note || activeGroup === "全部";
      if (!groupNote.hidden) {
        termLinkTopic = list[0].topic;
        termLinkNames = namesForTopic(list[0].topic, "");
        fillRich(groupNote, note);
      }
    }

    function renderRelated(node, entry) {
      node.replaceChildren();
      if (!entry.related) {
        node.hidden = true;
        return;
      }
      node.hidden = false;
      const names = allTermNames();
      const text = entry.related;
      let index = 0;
      while (index < text.length) {
        let matched = "";
        for (const name of names) {
          if (text.startsWith(name, index)) {
            matched = name;
            break;
          }
        }
        if (matched) {
          const jump = document.createElement("button");
          jump.type = "button";
          jump.textContent = matched;
          const targetName = matched;
          jump.addEventListener("click", () => {
            followTerm(entryByName(entry.topic, targetName));
          });
          node.append(jump);
          index += matched.length;
          continue;
        }
        let end = index + 1;
        while (end < text.length && !names.some((name) => text.startsWith(name, end))) end += 1;
        node.append(document.createTextNode(text.slice(index, end)));
        index = end;
      }
    }

    function renderNote(entry, list) {
      currentKey = entry.key;
      noteGroup.textContent = entry.chip;
      noteTitle.textContent = entry.name;
      noteStatus.hidden = false;
      noteStatus.textContent = entry.status || "未掌握";
      termLinkTopic = entry.topic;
      termLinkNames = namesForTopic(entry.topic, entry.name);
      fillRich(noteSummary, entry.summary || "");
      noteFields.replaceChildren();
      for (const [label, key] of fields) {
        if (!entry[key]) continue;
        const title = document.createElement("dt");
        title.textContent = label;
        const body = document.createElement("dd");
        fillRich(body, entry[key]);
        noteFields.append(title, body);
      }
      if (entry.related) {
        const relatedTitle = document.createElement("dt");
        relatedTitle.textContent = "相关";
        const related = document.createElement("dd");
        related.className = "related";
        renderRelated(related, entry);
        noteFields.append(relatedTitle, related);
      }
      const index = list.findIndex((item) => item.key === entry.key);
      prev.disabled = index <= 0;
      next.disabled = index === -1 || index >= list.length - 1;
      pagerCount.textContent = list.length ? `${index + 1} / ${list.length}` : "";
      document.title = `${entry.name} · 知识库`;
    }

    function updateTermBack() {
      const previous = trail[trail.length - 1];
      if (!previous) {
        termBack.hidden = true;
        termBack.replaceChildren();
        termBack.removeAttribute("aria-label");
        return;
      }
      const action = document.createElement("span");
      action.textContent = "返回上一术语";
      const name = document.createElement("span");
      name.textContent = previous.name;
      termBack.replaceChildren(action, name);
      termBack.setAttribute("aria-label", `返回上一术语：${previous.name}`);
      termBack.hidden = false;
    }

    function followTerm(target) {
      if (!target || target.key === currentKey) return;
      show(target.key, true, "push");
    }

    function show(key, scrollReader, trailAction) {
      let list = filtered();
      let entry = list.find((item) => item.key === key);
      if (!entry && key) {
        entry = flatEntries().find((item) => item.key === key);
        if (entry) {
          activeGroup = "全部";
          statusSelect.value = "全部";
          input.value = "";
          buildChips();
          list = filtered();
        }
      }
      if (!entry) entry = list[0];
      if (entry && trailAction === "clear" && entry.key !== currentKey) trail.length = 0;
      if (entry && trailAction === "push" && currentKey && currentKey !== entry.key) {
        const leaving = flatEntries().find((item) => item.key === currentKey);
        trail.push({ key: currentKey, name: leaving ? leaving.name : currentKey });
        if (trail.length > 40) trail.shift();
      }
      shown.textContent = String(list.length);
      empty.hidden = list.length !== 0;
      const note = document.querySelector("#note");
      const visible = Boolean(entry);
      noteGroup.hidden = !visible;
      noteTitle.hidden = !visible;
      noteSummary.hidden = !visible;
      noteStatus.hidden = !visible;
      articleBody.hidden = !visible;
      document.querySelector(".pager").hidden = !visible;
      if (!entry) {
        currentKey = "";
        noteTitle.hidden = false;
        noteTitle.textContent = "没有匹配的条目";
        renderList(list);
        updateTermBack();
        return;
      }
      if (hashKey() !== entry.key) {
        history.replaceState(null, "", `#${encodeURIComponent(entry.key)}`);
      }
      renderNote(entry, list);
      renderList(list);
      updateTermBack();
      if (!scrollReader) return;
      const reader = document.querySelector(".reader");
      if (window.matchMedia("(max-width: 900px)").matches) {
        note.scrollIntoView({ block: "start" });
      } else {
        reader.scrollTo(0, 0);
      }
    }

    function step(direction) {
      const list = filtered();
      const index = list.findIndex((item) => item.key === currentKey);
      const target = list[index + direction];
      if (target) show(target.key, true, "clear");
    }

    chipBox.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      activeGroup = chip.dataset.group;
      buildChips();
      const list = filtered();
      const keep = list.some((item) => item.key === currentKey);
      show(keep ? currentKey : (list[0] ? list[0].key : ""), false, keep ? "none" : "clear");
    });
    input.addEventListener("input", () => {
      const list = filtered();
      const keep = list.some((item) => item.key === currentKey);
      show(keep ? currentKey : (list[0] ? list[0].key : ""), false, keep ? "none" : "clear");
    });
    statusSelect.addEventListener("change", () => {
      const list = filtered();
      const keep = list.some((item) => item.key === currentKey);
      show(keep ? currentKey : (list[0] ? list[0].key : ""), false, keep ? "none" : "clear");
    });
    prev.addEventListener("click", () => step(-1));
    next.addEventListener("click", () => step(1));
    termBack.addEventListener("click", () => {
      const previous = trail.pop();
      if (!previous) {
        updateTermBack();
        return;
      }
      show(previous.key, true, "none");
    });
    window.addEventListener("hashchange", () => show(hashKey(), false));

    async function loadPage() {
      const response = await fetch("/api/knowledge");
      if (!response.ok) throw new Error("知识接口没有就绪");
      catalog = await response.json();
      buildChips();
      const wanted = flatEntries().find((item) => item.key === hashKey());
      show(wanted ? wanted.key : "", false);
    }

    loadPage().catch(() => {
      empty.hidden = false;
      empty.textContent = "知识库需要本机接口。用 Cursor 重新打开本仓库后会启动服务，再打开 http://127.0.0.1:8765/知识.html";
      noteTitle.textContent = "知识库还没有载入";
      articleBody.hidden = true;
      document.querySelector(".pager").hidden = true;
    });
  </script>
  <script src="back.js?v=2"></script>
