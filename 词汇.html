<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="public-read.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任沛新 · 词汇笔记</title>
  <meta name="description" content="任沛新的词汇笔记。一次阅读一条，可以分类、筛选和搜索。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141210'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' fill='%23f0d2cb' font-family='serif'%3E任%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=code-color">
</head>
<body>
  <a class="skip" href="#note">进入当前笔记</a>
  <div class="shell blog-shell">
    <aside class="rail">
      <p class="seal" aria-hidden="true">任</p>
      <h1>任沛新</h1>
      <p class="who">男 · 24 岁 · 汉族<br>河北邯郸</p>
      <p class="who">格拉斯哥大学<br>MSc in Computing Science<br>Distinction</p>
      <div class="switch" role="navigation" aria-label="切换界面">
        <a href="index.html">个人简历</a>
        <a href="学习.html">学习笔记</a>
        <a href="词汇.html" class="is-active" aria-current="page">词汇笔记</a>
        <a href="算法.html">算法习题</a>
        <a href="知识.html">知识库</a>
        <a href="本人.html">本人对话</a>
        <a href="科技.html">科技日览</a>
        <a href="难点.html">开发难点</a>
      </div>
      <div class="contact">
        <p><a href="mailto:renpeixin0924@icloud.com">renpeixin0924@icloud.com</a></p>
        <p><a href="tel:13180500889">13180500889</a></p>
        <p class="aim">求职 · 北京<br>人工智能、数据分析</p>
      </div>
    </aside>
    <main id="content" class="blog">
      <aside class="catalog">
        <p class="kicker">词汇笔记</p>
        <p class="section-note">一次显示一条。</p>
        <div class="chips" id="chips" role="toolbar" aria-label="按分组筛选"></div>
        <div class="toolbar">
          <label class="search">状态
            <select id="status">
              <option value="全部">全部状态</option>
              <option value="未掌握">未掌握</option>
              <option value="已能解释">已能解释</option>
            </select>
          </label>
          <label class="search">搜索
            <input id="q" type="search" placeholder="用语、问题或仓库文件" autocomplete="off">
          </label>
        </div>
        <p class="shown" aria-live="polite">显示 <span id="shown">0</span> / <span id="vocab-total">0</span></p>
        <p class="shown" id="practice-score" hidden></p>
        <p id="group-note" class="section-note" hidden></p>
        <div id="catalog"></div>
        <p id="empty" hidden>没有匹配的词条。</p>
      </aside>
      <article class="reader" id="note" aria-live="polite">
        <p class="kicker" id="note-group"></p>
        <h2 id="note-title">词汇笔记</h2>
        <p class="badge" id="note-status" hidden></p>
        <p class="section-note" id="note-asked" hidden></p>
        <div class="lead" id="note-summary"></div>
        <div class="article-body">
          <dl id="note-fields"></dl>
          <div>
            <p class="related" id="note-related" hidden></p>
            <div id="note-practice"></div>
          </div>
        </div>
        <div class="pager">
          <button type="button" class="clear" id="prev">上一条</button>
          <span id="pager-count"></span>
          <button type="button" class="clear" id="next">下一条</button>
        </div>
      </article>
    </main>
  </div>
  <script src="code-color.js"></script>
  <script>
    const input = document.querySelector("#q");
    const statusSelect = document.querySelector("#status");
    const chipBox = document.querySelector("#chips");
    const catalogBox = document.querySelector("#catalog");
    const empty = document.querySelector("#empty");
    const shown = document.querySelector("#shown");
    const vocabTotal = document.querySelector("#vocab-total");
    const groupNote = document.querySelector("#group-note");
    const practiceScore = document.querySelector("#practice-score");
    const noteGroup = document.querySelector("#note-group");
    const noteTitle = document.querySelector("#note-title");
    const noteStatus = document.querySelector("#note-status");
    const noteAsked = document.querySelector("#note-asked");
    const noteSummary = document.querySelector("#note-summary");
    const noteFields = document.querySelector("#note-fields");
    const noteRelated = document.querySelector("#note-related");
    const notePractice = document.querySelector("#note-practice");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const pagerCount = document.querySelector("#pager-count");
    const practiceKey = "vocab-practice-passed";

    let catalog = { groups: [] };
    let practice = { terms: [] };
    let activeGroup = "全部";
    let currentName = "";

    const fields = [
      ["概念", "concept"],
      ["它要解决的问题", "problem"],
      ["使用场景", "scenario"],
      ["例子", "example"],
      ["来源", "sources"],
      ["本仓库里的对应", "repo"],
    ];

    function appendLinked(parent, text) {
      const pattern = /https?:\/\/[^\s）)，。；、]+/g;
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        if (match.index > last) {
          parent.append(document.createTextNode(text.slice(last, match.index)));
        }
        const href = match[0];
        const link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = href;
        parent.append(link);
        last = match.index + href.length;
      }
      if (last < text.length) {
        parent.append(document.createTextNode(text.slice(last)));
      }
    }

    function appendInline(parent, text) {
      text.split("`").forEach((bit, index) => {
        if (index % 2 === 1) {
          const code = document.createElement("code");
          code.textContent = bit;
          parent.append(code);
        } else if (bit) {
          appendLinked(parent, bit);
        }
      });
    }

    function fillRich(node, text) {
      node.replaceChildren();
      String(text || "").split("```").forEach((piece, index) => {
        if (index % 2 === 1) {
          const newline = piece.indexOf("\n");
          const language = newline === -1 ? piece.trim() : piece.slice(0, newline).trim();
          const body = newline === -1 ? "" : piece.slice(newline + 1).replace(/\n$/, "");
          const pre = document.createElement("pre");
          pre.className = "code-block";
          pre.append(window.CodeColor.highlight(body, language));
          node.append(pre);
          return;
        }
        const paragraph = document.createElement("span");
        appendInline(paragraph, piece);
        node.append(paragraph);
      });
    }

    function flatTerms() {
      const rows = [];
      for (const group of catalog.groups || []) {
        for (const term of group.terms || []) {
          rows.push({ ...term, group: group.name });
        }
      }
      return rows;
    }

    function filtered() {
      const query = input.value.trim().toLowerCase();
      const status = statusSelect.value;
      return flatTerms().filter((term) => {
        if (activeGroup !== "全部" && term.group !== activeGroup) return false;
        if (status !== "全部" && (term.status || "未掌握") !== status) return false;
        if (!query) return true;
        const blob = [
          term.name, term.summary, term.concept, term.problem,
          term.scenario, term.example, term.sources, term.repo, term.related, term.status, term.asked_at, term.group,
        ].join("\n").toLowerCase();
        return blob.includes(query);
      });
    }

    function hashName() {
      const raw = location.hash.slice(1);
      if (!raw) return "";
      try {
        return decodeURIComponent(raw);
      } catch (_error) {
        return raw;
      }
    }

    function readPassed() {
      try {
        const saved = JSON.parse(localStorage.getItem(practiceKey) || "{}");
        return saved && typeof saved === "object" ? saved : {};
      } catch (_error) {
        return {};
      }
    }

    function refreshScore() {
      const total = (practice.terms || []).length;
      if (!total) {
        practiceScore.hidden = true;
        return;
      }
      const count = Object.values(readPassed()).filter(Boolean).length;
      practiceScore.hidden = false;
      practiceScore.textContent = `练习通过 ${count} / ${total}`;
    }

    function buildChips() {
      const groups = catalog.groups || [];
      const total = flatTerms().length;
      vocabTotal.textContent = String(total);
      chipBox.replaceChildren();
      const names = ["全部", ...groups.map((group) => group.name)];
      for (const name of names) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.group = name;
        const count = name === "全部" ? total : (groups.find((group) => group.name === name)?.terms.length || 0);
        chip.textContent = `${name} ${count}`;
        const on = name === activeGroup;
        chip.classList.toggle("is-active", on);
        chip.setAttribute("aria-pressed", on ? "true" : "false");
        chipBox.append(chip);
      }
    }

    function renderList(list) {
      catalogBox.replaceChildren();
      for (const term of list) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "entry";
        button.classList.toggle("is-current", term.name === currentName);
        const title = document.createElement("span");
        title.className = "entry-name";
        title.textContent = term.name;
        const meta = document.createElement("span");
        meta.className = "entry-meta";
        meta.textContent = `${term.group} · ${term.status || "未掌握"}`;
        button.append(title, meta);
        button.addEventListener("click", () => show(term.name, true));
        catalogBox.append(button);
      }
      const group = (catalog.groups || []).find((item) => item.name === activeGroup);
      const note = group && group.note ? group.note : "";
      groupNote.hidden = !note;
      if (note) fillRich(groupNote, note);
    }

    function renderRelated(term) {
      noteRelated.replaceChildren();
      if (!term.related) {
        noteRelated.hidden = true;
        return;
      }
      noteRelated.hidden = false;
      noteRelated.append(document.createTextNode("相关用语："));
      const known = new Set(flatTerms().map((item) => item.name));
      const parts = term.related.split(/([、，,])/);
      for (const part of parts) {
        const name = part.trim();
        if (known.has(name)) {
          const jump = document.createElement("button");
          jump.type = "button";
          jump.textContent = name;
          jump.addEventListener("click", () => show(name, true));
          noteRelated.append(jump);
        } else {
          appendInline(noteRelated, part);
        }
      }
    }

    function mountPractice(term) {
      notePractice.replaceChildren();
      const data = (practice.terms || []).find((item) => item.name === term.name);
      if (!data) return;
      const passed = readPassed();
      const box = document.createElement("details");
      box.className = "practice";
      box.open = true;
      if (passed[data.id]) box.classList.add("is-passed");
      const summary = document.createElement("summary");
      summary.textContent = passed[data.id] ? "练习通过" : `练习：${data.theory.length} 道选择，1 个使用案例`;
      box.append(summary);
      data.theory.forEach((question, index) => {
        const quiz = document.createElement("fieldset");
        quiz.className = "quiz";
        const legend = document.createElement("legend");
        legend.textContent = `${index + 1}. ${question.prompt}`;
        quiz.append(legend);
        question.choices.forEach((choice, choiceIndex) => {
          const label = document.createElement("label");
          label.className = "choice";
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `${data.id}-${question.id}`;
          radio.value = String(choiceIndex);
          const text = document.createElement("span");
          text.textContent = choice;
          label.append(radio, text);
          quiz.append(label);
        });
        const feedback = document.createElement("p");
        feedback.className = "feedback";
        feedback.hidden = true;
        quiz.append(feedback);
        box.append(quiz);
      });
      const caseTitle = document.createElement("p");
      caseTitle.className = "case-title";
      caseTitle.textContent = "使用案例";
      const caseBody = document.createElement("div");
      caseBody.className = "case";
      fillRich(caseBody, data.case || "");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "check";
      button.textContent = "检查";
      const result = document.createElement("p");
      result.className = "feedback";
      result.hidden = true;
      box.append(caseTitle, caseBody, button, result);
      button.addEventListener("click", async () => {
        const theory = {};
        let missing = false;
        for (const question of data.theory) {
          const selected = box.querySelector(`input[name="${data.id}-${question.id}"]:checked`);
          if (!selected) missing = true;
          else theory[question.id] = Number(selected.value);
        }
        if (missing) {
          result.hidden = false;
          result.className = "feedback bad";
          result.textContent = "还有选择题没有选择";
          return;
        }
        button.disabled = true;
        result.hidden = false;
        result.className = "feedback";
        result.textContent = "正在检查";
        try {
          const response = await fetch("/api/practice", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: data.id, theory }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "检查失败");
          const quizzes = [...box.querySelectorAll(".quiz")];
          data.theory.forEach((question, index) => {
            const item = (payload.theory || []).find((row) => row.id === question.id);
            const feedback = quizzes[index].querySelector(".feedback");
            feedback.hidden = false;
            const correct = Boolean(item && item.correct);
            feedback.className = correct ? "feedback ok" : "feedback bad";
            feedback.textContent = correct ? `选择正确。${item.explain}` : `这道题还没有选对。${item ? item.explain : ""}`;
          });
          result.className = payload.passed ? "feedback ok" : "feedback bad";
          result.textContent = payload.passed ? "选择题通过。" : "还有选择题没有选对。";
          if (payload.passed) {
            const saved = readPassed();
            saved[data.id] = true;
            localStorage.setItem(practiceKey, JSON.stringify(saved));
            box.classList.add("is-passed");
            summary.textContent = "练习通过";
            refreshScore();
          }
        } catch (error) {
          result.className = "feedback bad";
          result.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
      notePractice.append(box);
    }

    function renderNote(term, list) {
      currentName = term.name;
      noteGroup.textContent = term.group;
      noteTitle.textContent = term.name;
      noteStatus.hidden = false;
      noteStatus.textContent = term.status || "未掌握";
      noteAsked.hidden = !term.asked_at;
      noteAsked.textContent = term.asked_at ? `询问时间：${term.asked_at}` : "";
      fillRich(noteSummary, term.summary || "");
      noteFields.replaceChildren();
      for (const [label, key] of fields) {
        if (!term[key]) continue;
        const title = document.createElement("dt");
        title.textContent = label;
        const body = document.createElement("dd");
        fillRich(body, term[key]);
        noteFields.append(title, body);
      }
      renderRelated(term);
      mountPractice(term);
      const index = list.findIndex((item) => item.name === term.name);
      prev.disabled = index <= 0;
      next.disabled = index === -1 || index >= list.length - 1;
      pagerCount.textContent = list.length ? `${index + 1} / ${list.length}` : "";
      document.title = `${term.name} · 词汇笔记`;
    }

    function show(name, scrollReader) {
      let list = filtered();
      let term = list.find((item) => item.name === name);
      if (!term && name) {
        term = flatTerms().find((item) => item.name === name);
        if (term) {
          activeGroup = "全部";
          statusSelect.value = "全部";
          input.value = "";
          buildChips();
          list = filtered();
        }
      }
      if (!term) term = list[0];
      shown.textContent = String(list.length);
      empty.hidden = list.length !== 0;
      const note = document.querySelector("#note");
      const visible = Boolean(term);
      noteGroup.hidden = !visible;
      noteTitle.hidden = !visible;
      noteSummary.hidden = !visible;
      document.querySelector(".article-body").hidden = !visible;
      document.querySelector(".pager").hidden = !visible;
      if (!term) {
        currentName = "";
        noteTitle.hidden = false;
        noteTitle.textContent = "没有匹配的词条";
        renderList(list);
        return;
      }
      if (decodeURIComponentSafe(location.hash.slice(1)) !== term.name) {
        history.replaceState(null, "", `#${encodeURIComponent(term.name)}`);
      }
      renderNote(term, list);
      renderList(list);
      if (!scrollReader) return;
      const reader = document.querySelector(".reader");
      if (window.matchMedia("(max-width: 900px)").matches) {
        note.scrollIntoView({ block: "start" });
      } else {
        reader.scrollTo(0, 0);
      }
    }

    function decodeURIComponentSafe(value) {
      try {
        return decodeURIComponent(value);
      } catch (_error) {
        return value;
      }
    }

    function step(direction) {
      const list = filtered();
      const index = list.findIndex((item) => item.name === currentName);
      const target = list[index + direction];
      if (target) show(target.name, true);
    }

    chipBox.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      activeGroup = chip.dataset.group;
      buildChips();
      const list = filtered();
      const keep = list.some((item) => item.name === currentName);
      show(keep ? currentName : (list[0] ? list[0].name : ""), false);
    });
    input.addEventListener("input", () => {
      const list = filtered();
      const keep = list.some((item) => item.name === currentName);
      show(keep ? currentName : (list[0] ? list[0].name : ""), false);
    });
    statusSelect.addEventListener("change", () => {
      const list = filtered();
      const keep = list.some((item) => item.name === currentName);
      show(keep ? currentName : (list[0] ? list[0].name : ""), false);
    });
    prev.addEventListener("click", () => step(-1));
    next.addEventListener("click", () => step(1));
    window.addEventListener("hashchange", () => show(hashName(), false));

    async function loadPage() {
      const response = await fetch("/api/vocab");
      if (!response.ok) throw new Error("词汇接口没有就绪");
      catalog = await response.json();
      buildChips();
      try {
        const practiceResponse = await fetch("/api/practice");
        if (practiceResponse.ok) practice = await practiceResponse.json();
      } catch (_error) {
        practice = { terms: [] };
      }
      refreshScore();
      show(hashName(), false);
    }

    loadPage().catch(() => {
      empty.hidden = false;
      empty.textContent = "词条需要本机接口。用 Cursor 重新打开本仓库后会启动服务，再打开 http://127.0.0.1:8765/词汇.html";
      noteTitle.textContent = "词汇笔记还没有载入";
      document.querySelector(".article-body").hidden = true;
      document.querySelector(".pager").hidden = true;
    });
  </script>
  <script src="back.js?v=2"></script>
</body>
