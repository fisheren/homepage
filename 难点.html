    <main id="content">
      <section>
        <p class="kicker">开发难点</p>
        <h2>开发这个项目时问过的问题</h2>
        <p class="section-note">这些条目只收录技术问题。日常问答留在对话里。收集程序按主题归类，并缩短措辞。笔记保存在 <code>笔记/难点.md</code>。</p>
        <p class="shown" id="summary">正在读取。</p>
        <div id="list"></div>
      </section>
    </main>
  </div>
  <script>
    const summary = document.querySelector("#summary");
    const list = document.querySelector("#list");

    function line(item) {
      const row = document.createElement("li");
      const title = document.createElement("strong");
      title.textContent = item.title;
      const meta = document.createElement("span");
      const when = item.asked_at || "时间待补";
      const times = item.count > 1 ? ` · 出现 ${item.count} 次` : "";
      meta.textContent = when + times;
      row.append(title, meta);
      return row;
    }

    fetch("/api/difficulties")
      .then((response) => response.json())
      .then((payload) => {
        const groups = payload.groups || [];
        const asked = groups.reduce(
          (total, group) => total + group.items.reduce((sum, item) => sum + (item.count || 1), 0),
          0,
        );
        summary.textContent = `问过 ${asked} 次，收成 ${payload.total || 0} 条。`;
        list.replaceChildren();
        if (!groups.length) {
          const empty = document.createElement("p");
          empty.id = "empty";
          empty.textContent = "提问之后，条目会出现在这里。";
          list.append(empty);
          return;
        }
        for (const group of groups) {
          const section = document.createElement("section");
          section.className = "group";
          const heading = document.createElement("h3");
          heading.textContent = group.name;
          const note = document.createElement("p");
          note.className = "section-note";
          note.textContent = group.note || "";
          const items = document.createElement("ul");
          items.className = "difficulty-list";
          for (const item of group.items) {
            items.append(line(item));
          }
          section.append(heading, note, items);
          list.append(section);
        }
      })
      .catch(() => {
        summary.textContent = "读取开发难点时出现问题。请确认页面服务已启动。";
      });
  </script>
  <script src="back.js?v=2"></script>
