<body>

    <main id="content" class="blog">
      <aside class="catalog">
        <p class="kicker">算法习题</p>
        <p class="section-note">一次显示一道。笔记在 <code>笔记/算法习题.md</code>。</p>
        <div class="chips" id="chips" role="toolbar" aria-label="按算法筛选"></div>
        <div class="toolbar">
          <label class="search">状态
            <select id="status">
              <option value="全部">全部状态</option>
              <option value="未掌握">未掌握</option>
              <option value="已掌握">已掌握</option>
            </select>
          </label>
          <label class="search">搜索
            <input id="q" type="search" placeholder="题目、算法或关键词" autocomplete="off">
          </label>
        </div>
        <p class="shown" aria-live="polite">显示 <span id="shown">0</span> / <span id="problem-total">0</span></p>
        <p id="group-note" class="section-note" hidden></p>

        <p id="empty" hidden>没有匹配的习题。</p>

          <button type="button" class="clear" id="prev">上一道</button>

        </div>

  <script src="code-color.js"></script>
  <script>
    const input = document.querySelector("#q");
    const statusSelect = document.querySelector("#status");
    const chipBox = document.querySelector("#chips");
    const catalogBox = document.querySelector("#catalog");
    const groupNote = document.querySelector("#group-note");
    const shown = document.querySelector("#shown");
    const problemTotal = document.querySelector("#problem-total");
    const empty = document.querySelector("#empty");
    const noteGroup = document.querySelector("#note-group");
    const noteTitle = document.querySelector("#note-title");
    const noteStatus = document.querySelector("#note-status");
    const noteAsked = document.querySelector("#note-asked");
    const noteSummary = document.querySelector("#note-summary");
    const noteFields = document.querySelector("#note-fields");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const pagerCount = document.querySelector("#pager-count");
    const articleBody = document.querySelector(".article-body");

    const fields = [
      ["算法", "algorithm"],
      ["题目", "statement"],
      ["如何思考", "thinking"],
      ["例子", "example"],
      ["复杂度", "complexity"],
      ["来源", "sources"],
      ["本仓库里的对应", "repo"],
    ];

    let catalog = { groups: [] };
    let activeGroup = "全部";
    let currentName = "";

    function appendLinked(parent, text) {
      const pattern = /https?:\/\/[^\s）)，。；、]+/g;
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        if (match.index > last) {
          parent.append(document.createTextNode(text.slice(last, match.index)));
        }
        const href = match[0];
        const link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = href;
        parent.append(link);
        last = match.index + href.length;
      }
      if (last < text.length) {
        parent.append(document.createTextNode(text.slice(last)));
      }
    }

    function appendInline(parent, text) {
      text.split("`").forEach((bit, index) => {
        if (index % 2 === 1) {
          const code = document.createElement("code");
          code.textContent = bit;
          parent.append(code);
        } else if (bit) {
          appendLinked(parent, bit);
        }
      });
    }

    function fillRich(node, text) {
      node.replaceChildren();
      String(text || "").split("```").forEach((piece, index) => {
        if (index % 2 === 1) {
          const newline = piece.indexOf("\n");
          const language = newline === -1 ? piece.trim() : piece.slice(0, newline).trim();
          const body = newline === -1 ? "" : piece.slice(newline + 1).replace(/\n$/, "");
          const pre = document.createElement("pre");
          pre.className = "code-block";
          pre.append(window.CodeColor.highlight(body, language));
          node.append(pre);
          return;
        }
        const paragraph = document.createElement("span");
        appendInline(paragraph, piece);
        node.append(paragraph);
      });
    }

    function flatProblems() {
      const rows = [];
      for (const group of catalog.groups || []) {
        for (const problem of group.problems || []) {
          rows.push({ ...problem, group: group.name });
        }
      }
      return rows;
    }

    function filtered() {
      const query = input.value.trim().toLowerCase();
      const status = statusSelect.value;
      return flatProblems().filter((problem) => {
        if (activeGroup !== "全部" && problem.group !== activeGroup) return false;
        if (status !== "全部" && (problem.status || "未掌握") !== status) return false;
        if (!query) return true;
        const blob = [
          problem.name, problem.summary, problem.algorithm, problem.statement,
          problem.thinking, problem.example, problem.sources, problem.repo, problem.status, problem.asked_at, problem.group,
        ].join("\n").toLowerCase();
        return blob.includes(query);
      });
    }

    function hashName() {
      const raw = location.hash.slice(1);
      if (!raw) return "";
      try {
        return decodeURIComponent(raw);
      } catch (_error) {
        return raw;
      }
    }

    function buildChips() {
      const groups = catalog.groups || [];
      const total = flatProblems().length;
      problemTotal.textContent = String(total);
      chipBox.replaceChildren();
      const names = ["全部", ...groups.map((group) => group.name)];
      for (const name of names) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.group = name;
        const count = name === "全部" ? total : (groups.find((group) => group.name === name)?.problems.length || 0);
        chip.textContent = `${name} ${count}`;
        const on = name === activeGroup;
        chip.classList.toggle("is-active", on);
        chip.setAttribute("aria-pressed", on ? "true" : "false");
        chipBox.append(chip);
      }
    }

    function renderList(list) {
      catalogBox.replaceChildren();
      for (const problem of list) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "entry";
        button.classList.toggle("is-current", problem.name === currentName);
        const title = document.createElement("span");
        title.className = "entry-name";
        title.textContent = problem.name;
        const meta = document.createElement("span");
        meta.className = "entry-meta";
        meta.textContent = `${problem.group} · ${problem.algorithm || problem.status || "未掌握"}`;
        button.append(title, meta);
        button.addEventListener("click", () => show(problem.name, true));
        catalogBox.append(button);
      }
      const group = (catalog.groups || []).find((item) => item.name === activeGroup);
      const note = group && group.note ? group.note : "";
      groupNote.hidden = !note;
      if (note) fillRich(groupNote, note);
    }

    function renderNote(problem, list) {
      currentName = problem.name;
      noteGroup.textContent = problem.group;
      noteTitle.textContent = problem.name;
      noteStatus.hidden = false;
      noteStatus.textContent = problem.status || "未掌握";
      noteAsked.hidden = !problem.asked_at;
      noteAsked.textContent = problem.asked_at ? `记录时间：${problem.asked_at}` : "";
      fillRich(noteSummary, problem.summary || "");
      noteFields.replaceChildren();
      for (const [label, key] of fields) {
        if (!problem[key]) continue;
        const title = document.createElement("dt");
        title.textContent = label;
        const body = document.createElement("dd");
        fillRich(body, problem[key]);
        noteFields.append(title, body);
      }
      const index = list.findIndex((item) => item.name === problem.name);
      prev.disabled = index <= 0;
      next.disabled = index === -1 || index >= list.length - 1;
      pagerCount.textContent = list.length ? `${index + 1} / ${list.length}` : "";
      document.title = `${problem.name} · 算法习题`;
    }

    function show(name, scrollReader) {
      let list = filtered();
      let problem = list.find((item) => item.name === name);
      if (!problem && name) {
        problem = flatProblems().find((item) => item.name === name);
        if (problem) {
          activeGroup = "全部";
          statusSelect.value = "全部";
          input.value = "";
          buildChips();
          list = filtered();
        }
      }
      if (!problem) problem = list[0];
      shown.textContent = String(list.length);
      empty.hidden = list.length !== 0;
      const note = document.querySelector("#note");
      const visible = Boolean(problem);
      noteGroup.hidden = !visible;
      noteTitle.hidden = !visible;
      noteSummary.hidden = !visible;
      noteStatus.hidden = !visible;
      noteAsked.hidden = !visible;
      articleBody.hidden = !visible;
      document.querySelector(".pager").hidden = !visible;
      if (!problem) {
        currentName = "";
        noteTitle.hidden = false;
        noteTitle.textContent = "没有匹配的习题";
        renderList(list);
        return;
      }
      if (hashName() !== problem.name) {
        history.replaceState(null, "", `#${encodeURIComponent(problem.name)}`);
      }
      renderNote(problem, list);
      renderList(list);
      if (!scrollReader) return;
      const reader = document.querySelector(".reader");
      if (window.matchMedia("(max-width: 900px)").matches) {
        note.scrollIntoView({ block: "start" });
      } else {
        reader.scrollTo(0, 0);
      }
    }

    function step(direction) {
      const list = filtered();
      const index = list.findIndex((item) => item.name === currentName);
      const target = list[index + direction];
      if (target) show(target.name, true);
    }

    chipBox.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      activeGroup = chip.dataset.group;
      buildChips();
      const list = filtered();
      const keep = list.some((item) => item.name === currentName);
      show(keep ? currentName : (list[0] ? list[0].name : ""), false);
    });
    input.addEventListener("input", () => {
      const list = filtered();
      const keep = list.some((item) => item.name === currentName);
      show(keep ? currentName : (list[0] ? list[0].name : ""), false);
    });
    statusSelect.addEventListener("change", () => {
      const list = filtered();
      const keep = list.some((item) => item.name === currentName);
      show(keep ? currentName : (list[0] ? list[0].name : ""), false);
    });
    prev.addEventListener("click", () => step(-1));
    next.addEventListener("click", () => step(1));
    window.addEventListener("hashchange", () => show(hashName(), false));

    async function loadPage() {
      const response = await fetch("/api/algorithms");
      if (!response.ok) throw new Error("算法接口没有就绪");
      catalog = await response.json();
      buildChips();
      show(hashName(), false);
    }

    loadPage().catch(() => {
      empty.hidden = false;
      empty.textContent = "习题需要本机接口。用 Cursor 重新打开本仓库后会启动服务，再打开 http://127.0.0.1:8765/算法.html";
      noteTitle.textContent = "算法习题还没有载入";
      articleBody.hidden = true;
      document.querySelector(".pager").hidden = true;
    });
  </script>
